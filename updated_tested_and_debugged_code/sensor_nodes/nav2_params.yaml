amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # Set if you use a static map

bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_nav_to_pose_bt_xml: "navigate_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_vel_x: -0.4
    max_vel_x:  0.4
    min_vel_theta: -0.8
    max_vel_theta:  0.8
    # Adjust as needed for your catamaran's thruster capabilities

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0

local_costmap:
  ros__parameters:
    use_sim_time: false
    footprint: [[-1.175, -0.46], [-1.175, 0.46], [1.175, 0.46], [1.175, -0.46]]  # Example: 2.35m x 0.92m (adjust to your hull)
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: odom
    rolling_window: true
    width: 10.0
    height: 10.0
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      enabled: true
      observation_sources: scan
      scan:
        topic: /scan
        sensor_frame: lidar_link  # Make sure this matches your URDF/TF
        data_type: LaserScan
        clearing: true
        marking: true
    inflation_layer:
      enabled: true
      inflation_radius: 0.7  # Buffer for safe navigation

global_costmap:
  ros__parameters:
    use_sim_time: false
    footprint: [[-1.175, -0.46], [-1.175, 0.46], [1.175, 0.46], [1.175, -0.46]]
    robot_base_frame: base_link
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: map
    rolling_window: false
    width: 100.0
    height: 100.0
    resolution: 0.2
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      enabled: true
    obstacle_layer:
      enabled: true
      observation_sources: scan
      scan:
        topic: /scan
        sensor_frame: lidar_link
        data_type: LaserScan
        clearing: true
        marking: true
    inflation_layer:
      enabled: true
      inflation_radius: 1.2

recoveries_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
