slam_toolbox:
  ros__parameters:
    use_sim_time: false                # Set to true if using simulation or rosbag
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan                  # Make sure this matches your LIDAR topic
    resolution: 0.05                   # 5cm per grid cell
    max_laser_range: 12.0              # Set to your LIDAR's max range
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.174
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_maximum_variance_fine: 0.5
    loop_search_maximum_distance: 3.0
    mode: mapping                      # Use 'mapping' for building the map
